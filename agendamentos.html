<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos - NutriDash</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; height: 100vh; color: #333; }
        
        /* Menu Lateral */
        .sidebar { width: 250px; background-color: #2c3e50; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { color: #2ecc71; margin-bottom: 30px; text-align: center; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .sidebar a { color: white; text-decoration: none; padding: 12px; margin-bottom: 10px; border-radius: 5px; transition: 0.2s; font-weight: 500; display: flex; align-items: center; gap: 10px;}
        .sidebar a:hover, .sidebar a.ativo { background-color: #34495e; border-left: 4px solid #2ecc71; }
        
        /* Área Principal */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Layout de Agendamento */
        .agenda-container { display: flex; gap: 20px; flex-wrap: wrap; }
        
        .novo-agendamento { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); flex: 1; min-width: 300px; }
        .lista-agendamentos { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); flex: 2; min-width: 300px; }
        
        h3 { color: #2c3e50; margin-bottom: 20px; }
        
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group label { font-size: 13px; color: #7f8c8d; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        
        .btn-salvar { background-color: #2ecc71; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px;}
        .btn-salvar:hover { background-color: #27ae60; }

        /* Item da Lista de Agendamentos */
        .agendamento-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .agendamento-item:last-child { border-bottom: none; }
        .agendamento-info strong { display: block; color: #2c3e50; font-size: 16px; }
        .agendamento-info span { color: #7f8c8d; font-size: 14px; }
        .agendamento-data { background-color: #e8f8f5; color: #27ae60; padding: 8px 12px; border-radius: 5px; font-weight: bold; text-align: center;}
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🍏 NutriDash</h2>
        <a href="index.html">🏠 Visão Geral</a>
        <a href="#">📋 Meus Pacientes</a>
        <a href="agendamentos.html" class="ativo">📅 Agendamentos</a>
        <a href="#">🥗 Dietas e Fichas</a>
        <a href="#">💬 Chat (Dúvidas)</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Agenda de Consultas</h1>
        </div>

        <div class="agenda-container">
            <!-- Formulário para marcar consulta -->
            <div class="novo-agendamento">
                <h3>Marcar Consulta</h3>
                <form>
                    <div class="form-group">
                        <label>Paciente</label>
                        <input type="text" placeholder="Nome do paciente...">
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date">
                    </div>
                    <div class="form-group">
                        <label>Horário</label>
                        <input type="time">
                    </div>
                    <div class="form-group">
                        <label>Tipo de Consulta</label>
                        <select>
                            <option>Primeira Consulta</option>
                            <option>Retorno</option>
                            <option>Avaliação de Bioimpedância</option>
                        </select>
                    </div>
                    <button type="button" class="btn-salvar">Agendar Paciente</button>
                </form>
            </div>

            <!-- Lista de consultas do dia -->
            <div class="lista-agendamentos">
                <h3>Próximos Atendimentos</h3>
                
                <div class="agendamento-item">
                    <div class="agendamento-info">
                        <strong>Maria da Silva</strong>
                        <span>Primeira Consulta</span>
                    </div>
                    <div class="agendamento-data">
                        14:00<br><span style="font-size: 12px; font-weight: normal; color: #2ecc71;">Hoje</span>
                    </div>
                </div>

                <div class="agendamento-item">
                    <div class="agendamento-info">
                        <strong>João Pedro</strong>
                        <span>Retorno</span>
                    </div>
                    <div class="agendamento-data">
                        15:30<br><span style="font-size: 12px; font-weight: normal; color: #2ecc71;">Hoje</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
