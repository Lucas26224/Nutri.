<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriDash - Painel da Nutricionista</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; height: 100vh; color: #333; }
        
        /* Menu Lateral */
        .sidebar { width: 250px; background-color: #2c3e50; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { color: #2ecc71; margin-bottom: 30px; text-align: center; font-size: 24px; }
        .sidebar a { color: white; text-decoration: none; padding: 12px; margin-bottom: 10px; border-radius: 5px; transition: 0.2s; font-weight: 500; }
        .sidebar a:hover { background-color: #34495e; border-left: 4px solid #2ecc71; }
        
        /* Área Principal */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { color: #2c3e50; }
        
        .btn-novo { background-color: #2ecc71; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; }
        .btn-novo:hover { background-color: #27ae60; }
        
        /* Cartões de Resumo */
        .cards { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); flex: 1; min-width: 200px; }
        .card h3 { color: #7f8c8d; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card p { font-size: 32px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🍏 NutriDash</h2>
        <a href="#">📋 Meus Pacientes</a>
        <a href="#">🥗 Dietas e Fichas</a>
        <a href="#">💬 Chat (Dúvidas)</a>
        <a href="#">💡 Dicas do Dia</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Visão Geral</h1>
            <button class="btn-novo">+ Novo Paciente</button>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Pacientes Ativos</h3>
                <p>42</p>
            </div>
            <div class="card">
                <h3>Consultas Hoje</h3>
                <p>5</p>
            </div>
            <div class="card">
                <h3>Mensagens Não Lidas</h3>
                <p>3</p>
            </div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <h3 style="color: #2c3e50;">Próximos Atendimentos</h3>
            <p style="font-size: 15px; color: #7f8c8d; font-weight: normal; margin-top: 15px;">
                A lista de pacientes agendados para hoje e seus botões de prontuário aparecerão aqui.
            </p>
        </div>
    </div>

</body>
</html>
